[metadata]
name = {{ cookiecutter.project_slug }}
version = {{ cookiecutter.version }}
description = {{ cookiecutter.project_short_description }}

[options]
packages = find:
# Include data files as specified in MANIFEST.in
include_package_data = True
install_requires =
    django >= 3.2
    airavata-python-sdk >= 3.0.0

[options.entry_points]
airavata.djangoapp =
    {{ cookiecutter.project_slug }} = {{ cookiecutter.project_slug }}.apps:{{ cookiecutter.app_config_class_name }}
airavata.output_view_providers =
    {{ cookiecutter.project_slug }} = {{ cookiecutter.project_slug }}.output_views.{{ cookiecutter.project_slug }}_output_view:{{ cookiecutter.output_view_provider_class_name }}
