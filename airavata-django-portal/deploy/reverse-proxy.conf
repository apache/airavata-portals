# Reverse proxy that unifies the Airavata Django portal (the gateway app) and the
# standalone airavata-cms service (landing pages, documentation, other content)
# behind one origin. The portal stopped serving CMS content when Wagtail was
# removed; this proxy routes the portal's app paths to the portal and everything
# else to the CMS.
#
# Set the two upstreams to wherever the services run (host:port), then drop this
# server block into nginx. See deploy/README.md for the CMS-side prefix contract.

upstream airavata_portal { server portal:8000; }
upstream airavata_cms    { server cms:8000; }

server {
    listen 80;
    server_name _;
    client_max_body_size 64m;  # matches the portal's FILE_UPLOAD_MAX_FILE_SIZE

    # --- Portal (gateway app) paths -------------------------------------------
    # Keep in sync with django_airavata/urls.py. /static and /media are the
    # portal's; the CMS serves its assets under /cms-static and /cms-media.
    location ~ ^/(djadmin|admin|auth|workspace|api|groups|dataparsers|sdk|home|static|media)(/|$) {
        proxy_pass http://airavata_portal;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- CMS (landing pages, docs, Wagtail admin) — everything else -----------
    location / {
        proxy_pass http://airavata_cms;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
