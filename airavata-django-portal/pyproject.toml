[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
airavata-python-sdk = { path = "../../../airavata/fix-sharing-init/airavata-python-sdk", editable = true }

[project]
name = "airavata-django-portal"
version = "0.2.0"
description = "The Airavata Django Portal is a web interface to the Apache Airavata API."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "Apache Software Foundation", email = "dev@airavata.apache.org" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.1",
    "Framework :: Wagtail",
    "Framework :: Wagtail :: 6",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]
dependencies = [
    "Django>=5.1,<5.2",
    "djangorestframework>=3.15,<4",
    "requests>=2.32",
    "requests-oauthlib>=1.4",
    "logging-formatter-anticrlf>=1.2",
    "wagtail>=6.3,<7",
    "papermill>=2.6",
    "nbformat>=5.10",
    "nbconvert>=7.16",
    "grpcio>=1.70",
    "airavata-python-sdk>=3.0",
    "django-vite>=3.0",
    "asyncssh>=2.17",
    "uvicorn[standard]>=0.32",
    "wagtail-draftail-anchors>=0.5",
    "wagtailcodeblock>=1.28,<1.29",
    "setuptools<81",
    "pytz",
]

[project.optional-dependencies]
mysql = [
    "mysqlclient",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "ty",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "django-stubs>=5.1",
    "pytest-asyncio>=1.3.0",
]

[project.urls]
Homepage = "https://github.com/apache/airavata-django-portal"

[tool.setuptools.packages.find]
include = ["django_airavata*"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]

[tool.ty.environment]
python-version = "3.12"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "django_airavata.settings"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
