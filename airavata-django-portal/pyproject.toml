[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airavata-django-portal"
version = "0.2.0"
description = "The Airavata Django Portal is a web interface to the Apache Airavata API."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "Apache Software Foundation", email = "dev@airavata.apache.org" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.1",
    "Framework :: Wagtail",
    "Framework :: Wagtail :: 6",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]
dependencies = [
    "Django>=5.1,<5.2",
    "djangorestframework>=3.15,<4",
    "requests>=2.32",
    "requests-oauthlib>=1.4",
    "django-webpack-loader>=3.1",
    "logging-formatter-anticrlf>=1.2",
    "wagtail>=6.3,<7",
    "papermill>=2.6",
    "nbformat>=5.10",
    "nbconvert>=7.16",
    "grpcio>=1.70",
    "airavata-python-sdk>=3.0",
]

[project.optional-dependencies]
dev = [
    "flake8",
    "flake8-isort",
]
mysql = [
    "mysqlclient",
]

[project.urls]
Homepage = "https://github.com/apache/airavata-django-portal"

[tool.setuptools.packages.find]
include = ["django_airavata*"]

[tool.flake8]
exclude = [
    "venv",
    "./airavata",
    "node_modules",
    "settings_local.py",
    "*/migrations",
    ".tox",
]
ignore = ["E501", "W504"]

[tool.isort]
multi_line_output = 3
skip = ["migrations", ".git"]
skip_gitignore = true
known_third_party = ["airavata_sdk", "airavata_django_portal_sdk"]
