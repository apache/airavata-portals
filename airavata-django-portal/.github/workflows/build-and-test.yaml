name: Build and Test
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js as specified in .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies (npm workspaces)
        run: |
          npm ci
      - name: Run ESLint on JavaScript code
        run: |
          ./lint_js.sh
      - name: Build JavaScript code
        run: |
          ./build_js.sh
      - name: Run JavaScript unit tests
        run: |
          ./test_js.sh
      - uses: actions/upload-artifact@v4
        with:
          name: built-javascript
          path: |
            django_airavata/apps/api/static/django_airavata_api/dist
            django_airavata/static/common/dist
            django_airavata/apps/admin/static/django_airavata_admin/dist
            django_airavata/apps/groups/static/django_airavata_groups/dist
            django_airavata/apps/auth/static/django_airavata_auth/dist
            django_airavata/apps/workspace/static/django_airavata_workspace/dist
            django_airavata/apps/dataparsers/static/django_airavata_dataparsers/dist

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: airavata-django-portal
    steps:
      - uses: actions/checkout@v4
        with:
          path: airavata-django-portal
      # The portal's only Airavata dependency, airavata-python-sdk, is resolved
      # from a sibling apache/airavata checkout (see [tool.uv.sources] in
      # pyproject.toml -> ../../airavata/airavata-python-sdk). It is not on PyPI.
      - uses: actions/checkout@v4
        with:
          repository: apache/airavata
          path: airavata
      - name: Install uv (and Python 3.12)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Format check (ruff)
        run: uv run ruff format --check .
      - name: Type check (ty)
        run: uv run ty check
      - name: Django system check (no database, no migrations)
        run: uv run python manage.py check
      - name: Run Django unit tests
        run: uv run ./runtests.py
