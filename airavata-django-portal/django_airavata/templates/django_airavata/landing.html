<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ portal_title }}</title>
  <link rel="icon" href="/static/images/airavata-logo.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
    }
    .landing-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
      padding: 3rem;
      max-width: 520px;
      width: 92%;
      text-align: center;
    }
    .landing-card__logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem;
    }
    .landing-card__logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .landing-card__title {
      font-size: 1.75rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 0.75rem;
    }
    .landing-card__description {
      font-size: 1rem;
      color: #666;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .landing-card__btn {
      display: inline-block;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      text-decoration: none;
      padding: 0.875rem 2.5rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }
    .landing-card__btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
      color: #fff;
    }
    .landing-card__btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="landing-card">
    <div class="landing-card__logo">
      <img src="/static/images/airavata-logo.png" alt="{{ portal_title }}">
    </div>
    <h1 class="landing-card__title">{{ portal_title }}</h1>
    <p class="landing-card__description">
      A science gateway for managing computational experiments, data, and research workflows on high-performance computing resources.
    </p>
    <a href="{% url 'django_airavata_auth:login' %}" class="landing-card__btn">
      Sign In
    </a>
  </div>
</body>
</html>
