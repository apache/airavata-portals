{% load static %}
{% if logo_url %}
<div class=c-header__logo{% if logo_background_color %} style="background-color: {{ logo_background_color }}"{% endif %}>
    <a href="/">
        <img src="{{ logo_url }}" />
    </a>
</div>
{% else %}
<div class=c-header__logo>
    <a href="/">
        <img src="{% static 'images/airavata-logo.png' %}" />
    </a>
</div>
{% endif %}
